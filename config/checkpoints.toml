# ---- 曖昧な表現（具体化の入口）----
[[vague]]
word = "速"
asks = ["どの操作の、何秒以内ですか。", "測定条件（件数・時間帯・端末・拠点）は何ですか。", "満たせない場合の例外はありますか。"]
[[vague]]
word = "すぐ"
asks = ["いつまでに、何が完了していればよいですか。", "測定の開始点と終了点はどこですか。"]
[[vague]]
word = "止めない"
asks = ["計画停止は許容しますか。", "障害時に許容できる停止時間はどのくらいですか。", "対象の業務・時間帯はどこですか。"]
[[vague]]
word = "止まりにく"
asks = ["障害時に許容できる停止時間はどのくらいですか。", "どの障害を想定しますか。", "切替時間の条件はありますか。"]
[[vague]]
word = "無停止"
asks = ["計画停止も含みますか。", "移行・保守のときも対象ですか。"]
[[vague]]
word = "失いたくない"
asks = ["どの時点まで戻せればよいですか（許容データ損失）。", "対象のデータはどれですか。", "復旧を確認する方法は何ですか。"]
[[vague]]
word = "十分"
asks = ["何に対して十分ですか。", "判定に使う数値と測定条件は何ですか。"]
[[vague]]
word = "簡単"
asks = ["誰が、どの操作を、どのくらいの時間でできればよいですか。", "教育や手順書は前提にしますか。"]
[[vague]]
word = "なるべく"
asks = ["どの場合に例外を認めますか。", "判断するのは誰ですか。"]
[[vague]]
word = "柔軟"
asks = ["具体的にどの変更ができればよいですか。", "変更するのは誰ですか。"]
[[vague]]
word = "適切"
asks = ["判定の基準は何ですか。", "判断するのは誰ですか。"]

# ---- 矛盾候補の検出パターン（プログラムで検出。適用範囲は人が確認する）----
[[conflict_patterns]]
id = "immutable_vs_edit"
a = "(変更|修正|訂正)(不可|できない|を認めない)"
b = "(変更|修正|訂正)(可能|できる|を認める|したい)"
note = "変更不可と変更可能が併存しています。対象の状態（承認前・承認後）と例外を確認してください。"
[[conflict_patterns]]
id = "nonstop_vs_cutover"
a = "(無停止|止めない|止めたくない|停止(は|を)?(認めない|不可))"
b = "(切替|切り替え|移行|メンテナンス|保守|パッチ).{0,20}(停止|止め)|(停止|止め).{0,20}(切替|切り替え|移行|メンテナンス|保守)"
note = "無停止の希望と、停止を伴う可能性のある作業が併存しています。計画停止を含むか確認してください。"
[[conflict_patterns]]
id = "noexternal_vs_remote"
a = "外部(から)?(の)?(接続|通信).{0,10}(禁止|不可|認めない)"
b = "(遠隔保守|リモート保守|遠隔(から)?(の)?(接続|作業)|リモート(接続|作業))"
note = "外部接続の禁止と遠隔保守が併存しています。禁止の適用範囲と例外手続きの有無を確認してください。"
[[conflict_patterns]]
id = "nodataloss_vs_backup"
a = "(データ|情報).{0,12}(損失|消失|失).{0,8}(不可|ない|認めない|たくない)"
b = "バックアップ.{0,12}(日次|毎日|1日1回|週次|週1)|(日次|毎日|1日1回|週次|週1).{0,12}バックアップ"
note = "データ損失を認めない希望と、定期バックアップの間隔が併存しています。許容データ損失を確認してください。"
[[conflict_patterns]]
id = "freeze_vs_recalc"
a = "(締め後|確定後|締切後).{0,16}(固定|変更不可|変更しない|変更できない)"
b = "再集計"
note = "締め後の固定と再集計が併存しています。訂正の扱いと版の管理を確認してください。"

# ---- 過大評価の注意（二重化・バックアップ等があるだけで達成としない）----
[[overclaim]]
pattern = "(二重化|冗長化|冗長構成)"
note = "二重化の記載だけでは、切替時間や停止時間の条件を満たす根拠になりません。条件と確認方法を設定してください。"
[[overclaim]]
pattern = "バックアップ"
